# PORT is given by Render. On your own PC it is 8080.
server.port=${PORT:8080}

# ---- DATABASE ----
# On your PC these default values are used (MySQL). On Render we set DB_URL, DB_USERNAME
# and DB_PASSWORD as environment variables, so you do not have to edit this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# This makes Spring create the tables for us automatically
spring.jpa.hibernate.ddl-auto=update

# The address of the website that is allowed to call this server (more than one: separate with commas)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
